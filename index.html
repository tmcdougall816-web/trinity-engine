<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinity Engine V10.3.5 - APEX LISTENER</title>
    <style>
        :root { --matrix-green: #00ff41; --danger-red: #ff0000; --void-black: #0d0208; }
        body, html { background-color: var(--void-black); color: var(--matrix-green); font-family: 'Courier New', monospace; margin: 0; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        canvas#matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.25; }
        #security-lock { width: 400px; padding: 40px; border: 2px solid var(--matrix-green); background: rgba(0,0,0,0.9); text-align: center; }
        #main-interface { display: none; width: 95%; max-width: 1200px; height: 90vh; border: 2px solid var(--matrix-green); padding: 20px; background: rgba(0,0,0,0.95); box-sizing: border-box; }
        .panel { border: 1px solid var(--matrix-green); padding: 15px; margin-bottom: 10px; background: rgba(20,20,20,0.8); }
        input, button { background: #000; border: 1px solid var(--matrix-green); color: var(--matrix-green); padding: 10px; width: 100%; box-sizing: border-box; margin-top: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background: var(--matrix-green); color: #000; }
        #audit-log { height: 200px; border: 1px solid var(--matrix-green); padding: 10px; overflow-y: auto; font-size: 0.85rem; background: #000; white-space: pre-wrap; }
        .mic-active { background: var(--danger-red) !important; color: #fff !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
<canvas id="matrix"></canvas>

<div id="security-lock">
    <h2 style="letter-spacing: 5px;">ACCESS RESTRICTED</h2>
    <input type="text" id="access-id" placeholder="ARCHITECT ID" style="text-align: center;">
    <input type="password" id="protocol-key" placeholder="SECURITY KEY" style="text-align: center; margin-top: 10px;">
    <button onclick="unlock()">INITIALIZE</button>
</div>

<div id="main-interface">
    <h1 style="text-align: center; letter-spacing: 8px; margin: 0 0 10px 0;">TRINITY ENGINE V10.3.5</h1>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="panel">
            <h3>I. VOICE CAPTURE</h3>
            <button id="mic-btn" onclick="toggleVoice()">START VOICE CAPTURE</button>
            <div id="status-msg" style="font-size: 0.7rem; margin-top: 5px; color: #fff;">MIC STATUS: STANDBY</div>
        </div>
        <div class="panel">
            <h3>IV. PROBABILITY</h3>
            <div style="height: 30px; border: 1px solid #333; position: relative;">
                <div id="bar" style="height: 100%; width: 0%; background: var(--matrix-green); transition: 1s;"></div>
            </div>
            <div id="p-text" style="text-align: center; margin-top: 5px;">0% CERTAINTY</div>
        </div>
    </div>
    <div class="panel" style="flex-grow: 1;">
        <h3>SYSTEM AUDIT LOG</h3>
        <div id="audit-log">> SYSTEM READY. AWAITING ENCRYPTION KEY...</div>
    </div>
</div>

<script>
    function unlock() {
        if(document.getElementById('access-id').value.toUpperCase() === "TY-ARCHITECT-01" && document.getElementById('protocol-key').value === "TRZ-7789-APEX") {
            document.getElementById('security-lock').style.display = 'none';
            document.getElementById('main-interface').style.display = 'block';
        }
    }

    function addLog(m) {
        const l = document.getElementById('audit-log');
        l.innerHTML += `<br>[${new Date().toLocaleTimeString()}] > ${m}`;
        l.scrollTop = l.scrollHeight;
    }

    let recognition;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true; // CHANGED: Now shows text while you speak!

        recognition.onstart = () => {
            isListening = true;
            document.getElementById('mic-btn').classList.add('mic-active');
            document.getElementById('mic-btn').innerText = "LISTENING... (STOP)";
            addLog("VOICE ENGINE ONLINE.");
        };

        recognition.onresult = (event) => {
            let interim = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    addLog(`CONFIRMED: ${event.results[i][0].transcript.toUpperCase()}`);
                } else {
                    interim += event.results[i][0].transcript;
                }
            }
            document.getElementById('status-msg').innerText = "LIVE: " + interim;
        };

        recognition.onend = () => {
            isListening = false;
            document.getElementById('mic-btn').classList.remove('mic-active');
            document.getElementById('mic-btn').innerText = "START VOICE CAPTURE";
        };
    }

    function toggleVoice() {
        if (!recognition) return alert("Browser not supported.");
        isListening ? recognition.stop() : recognition.start();
    }

    // MATRIX EFFECT
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/20)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#0F0"; ctx.font = "15px monospace";
        drops.forEach((y, i) => {
            ctx.fillText("1010101TRINITY"[Math.floor(Math.random()*14)], i*20, y*20);
            if(y*20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 50);
</script>
</body>
</html>
